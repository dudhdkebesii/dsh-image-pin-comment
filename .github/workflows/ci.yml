name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 语法检查
        run: npm run check
      - name: 冒烟测试（fixture · 真实 Chrome）
        run: |
          # 把输出同时留在日志和（失败时）annotation 里，方便不开日志定位问题
          set +e
          node test/smoke.mjs 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::冒烟测试失败（exit $status）"
            tail -c 4000 smoke.log | sed 's/^/::error::/'
            google-chrome --version || true
            node --version
            exit "$status"
          fi
      - name: 打包内容检查
        run: npm pack --dry-run
