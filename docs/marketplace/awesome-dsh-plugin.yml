description:
  en: Pin numbered anchors on a DSH image preview, then send the untouched original image together with a coordinate list carrying percentages, pixels, tolerance and a suggested crop box; several images per message keep their own 「image N」 numbering.
  zh: 在 DSH 图片预览上钉编号锚点，随未改动的原图一起发出坐标清单（百分比、像素、容差、建议裁切框）；一条消息里标注多张图时各自独立编号。
